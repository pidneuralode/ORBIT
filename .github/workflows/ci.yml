name: Lightweight validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated development dependencies
        run: python -m pip install -e '.[dev]'
      - name: Test synthetic production interfaces
        run: python -m pytest -q
      - name: Static and type checks
        run: |
          python -m ruff check src tests scripts
          python -m ruff format --check src tests scripts
          python -m mypy src/orbit
      - name: Fresh wheel installation smoke
        run: python scripts/validate_install.py
      - name: Actual index and working tree release scan
        run: python scripts/check_release_scope.py
      - name: Reviewed HEAD export and test
        run: |
          python scripts/export_release.py --destination "$RUNNER_TEMP/orbit-reviewed-source"
          cd "$RUNNER_TEMP/orbit-reviewed-source"
          PYTHONPATH="$PWD/src" python -m pytest -q
          python scripts/validate_install.py
