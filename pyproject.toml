[build-system]
requires = ["setuptools>=61", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "orbit-rubrics"
version = "0.1.0"
description = "Reusable rubric scoring, generation and evaluation workflows for ORBIT"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.optional-dependencies]
api = ["openai>=1"]
config = ["PyYAML>=6"]
dev = ["pytest>=7", "ruff>=0.6", "mypy>=1", "hydra-core>=1.3", "pyarrow>=19", "PyYAML>=6", "wheel>=0.38", "setuptools>=61"]
data = ["pyarrow>=19"]
models = ["torch>=2", "transformers>=4.51"]
# Training dependencies belong to the separately retained verl distribution.

[project.scripts]
orbit = "orbit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
license-files = ["LICENSE", "NOTICE", "docs/licenses/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
files = ["src/orbit"]
check_untyped_defs = true
ignore_missing_imports = true
